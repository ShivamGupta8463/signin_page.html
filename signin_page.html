<!DOCTYPE html>
<html>
<head>

    <title>Login Page</title>

    <style>

        /* =========================
           BASIC CSS
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            background-color: #eeeeee;

            font-family: Arial, sans-serif;
        }


        /* =========================
           MAIN LOGIN BOX
        ========================= */

        .login-box {
            width: 1100px;
            height: 750px;

            margin: 40px auto;

            background: linear-gradient(
                to bottom,
                #7777e8,
                #eeeeff
            );

            border: 5px solid #315db5;

            border-radius: 30px;

            padding-top: 20px;
        }


        /* =========================
           HEADING
        ========================= */

        h1 {
            text-align: center;

            color: #333333;

            font-size: 40px;

            margin-bottom: 55px;
        }


        /* =========================
           ROW
        ========================= */

        .row {
            display: flex;

            align-items: center;

            margin-bottom: 120px;
        }


        /* =========================
           LABEL
        ========================= */

        label {
            width: 380px;

            margin-left: 45px;

            color: #1452a0;

            font-size: 38px;
        }


        /* =========================
           INPUT
        ========================= */

        input[type="text"],
        input[type="password"] {

            width: 500px;

            height: 70px;

            background-color: #fffda0;

            border: 5px solid #2861bd;

            border-radius: 15px;

            outline: none;

            font-size: 30px;

            padding: 0 15px;
        }


        /* =========================
           BUTTON
        ========================= */

        .button {
            text-align: center;

            margin-top: -20px;
        }


        input[type="submit"] {

            width: 380px;

            height: 90px;

            background-color: #fffde0;

            border: 5px solid #2861bd;

            border-radius: 20px;

            color: #888888;

            font-size: 38px;

            cursor: pointer;
        }


        input[type="submit"]:hover {
            background-color: #ffffb0;
        }


        /* ==================================================
           MEDIA QUERY - TABLET
           Screen width 768px se 1100px
        ================================================== */

        @media screen and (max-width: 1100px) {

            .login-box {
                width: 90%;
                height: auto;

                padding: 30px;
            }

            h1 {
                font-size: 34px;
            }

            label {
                width: 35%;
                margin-left: 10px;

                font-size: 30px;
            }

            input[type="text"],
            input[type="password"] {
                width: 60%;
            }

        }


        /* ==================================================
           MEDIA QUERY - MOBILE
           Screen width 600px ya usse kam
        ================================================== */

        @media screen and (max-width: 600px) {

            .login-box {
                width: 95%;

                height: auto;

                margin: 20px auto;

                padding: 20px;

                border-radius: 20px;
            }


            /* Heading mobile par chhoti */
            h1 {
                font-size: 25px;

                margin-bottom: 40px;
            }


            /* Row ko column mein convert karna */
            .row {
                display: block;

                margin-bottom: 40px;
            }


            /* Label */
            label {
                display: block;

                width: 100%;

                margin-left: 0;

                margin-bottom: 10px;

                font-size: 25px;
            }


            /* Input mobile par full width */
            input[type="text"],
            input[type="password"] {

                width: 100%;

                height: 55px;

                font-size: 20px;
            }


            /* Button */
            .button {
                margin-top: 10px;

                margin-bottom: 20px;
            }


            input[type="submit"] {

                width: 70%;

                height: 65px;

                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>Login to your account</h1>


        <!-- User Name -->

        <div class="row">

            <label>User Name</label>

            <input type="text">

        </div>


        <!-- Password -->

        <div class="row">

            <label>Password</label>

            <input type="password">

        </div>


        <!-- Sign In -->

        <div class="button">

            <input type="submit" value="Sign in">

        </div>

    </div>


</body>
</html>
